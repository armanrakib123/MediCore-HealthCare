services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: interacthub_db
    environment:
      POSTGRES_USER: interacthub_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: interacthub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service (ASP.NET API)
  api:
    build:
      context: ./Backend/InteractHub.API
      dockerfile: Dockerfile
    container_name: interacthub_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=interacthub_db;Username=interacthub_admin;Password=password123;
    ports:
      - "5120:8080"
    depends_on:
      - db

  # Frontend Service (React + Vite)
  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: interacthub_web
    environment:
      - VITE_API_URL=http://localhost:5120/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
